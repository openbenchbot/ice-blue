apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - rbac.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: log-shipper-config
    namespace: portal
    literals:
      - FLUSH_INTERVAL=5s
      - RUNTIME=containerd

patches:
  - path: deployment-log-shipper.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: portal
