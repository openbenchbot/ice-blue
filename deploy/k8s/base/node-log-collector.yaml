apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-log-collector
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-collector
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-log-collector
    spec:
      serviceAccountName: node-log-collector
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/node-log-collector:1.6.0
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
