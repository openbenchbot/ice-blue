apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal
  namespace: portal
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal
  namespace: portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: portal
