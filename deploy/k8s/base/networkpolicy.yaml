apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal
  namespace: portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
