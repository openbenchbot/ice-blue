name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix:
        env: [dev, staging, prod]
    environment: ${{ matrix.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::123456789012:role/portal-${{ matrix.env }}-ci
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: 123456789012.dkr.ecr.us-east-1.amazonaws.com/portal:${{ matrix.env }}-${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: Apply infrastructure
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -lock-timeout=120s

      - name: Render manifests
        run: kubectl kustomize deploy/k8s/overlays/${{ matrix.env }} > manifests.yaml

      - name: Deploy manifests
        run: |
          aws eks update-kubeconfig --name portal-${{ matrix.env }} --region us-east-1
          kubectl apply -f manifests.yaml
